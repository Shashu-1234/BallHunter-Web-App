<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071008"><title>BallHunter</title>
<style>
:root{--bg:#071008;--panel:#101a12;--panel2:#142218;--line:#26382b;--green:#83f23c;--text:#f4f7f2;--muted:#9cab9e;--warn:#ffd45b;--red:#ff5f68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#173d1d 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}.top{height:64px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:20}.brand{font-weight:900;font-size:22px}.brand b{color:var(--green)}button,input{font:inherit}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:#101712;color:#fff}.hero{padding:26px 0 12px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:800}.hero h1{font-size:42px;line-height:1.02;margin:9px 0 12px;letter-spacing:-.04em}.hero h1 span{color:var(--green)}.hero p,.copy{color:var(--muted);line-height:1.55}.orb{width:150px;height:150px;border:1px solid #315338;border-radius:50%;margin:25px auto;display:grid;place-items:center;position:relative;box-shadow:0 0 55px #3cff5122 inset}.ball{width:83px;height:83px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dcff66,#76dd2f 55%,#3d9520);box-shadow:0 0 35px #91ff4b55}.orb:after{content:"";position:absolute;inset:18px;border:2px dashed #83f23c66;border-radius:50%;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.stack{display:grid;gap:12px}.card,.panel{background:linear-gradient(145deg,#111b13,#0e160f);border:1px solid var(--line);border-radius:22px}.action{width:100%;padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);color:#fff;display:grid;grid-template-columns:48px 1fr auto;gap:14px;text-align:left;align-items:center}.action.primary{background:linear-gradient(135deg,#2a8d1f,#4fd322);border-color:#65ef38}.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;font-size:24px}.action strong{display:block;font-size:16px}.action small{display:block;margin-top:4px;color:#c8d3c8}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:22px 0 14px}.sectionHead h2{margin:4px 0 0;font-size:28px}.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--green);color:#0a1309;font-size:26px}.balls{display:grid;gap:12px}.ballRow{padding:12px;display:flex;gap:13px;align-items:center}.thumb{width:66px;height:66px;border-radius:16px;object-fit:cover;background:#1b281d}.grow{flex:1}.ballRow strong{display:block}.ballRow small{color:var(--muted)}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;background:var(--green);color:#0b1609}.btn.secondary{background:#172219;color:#fff;border:1px solid var(--line)}.panel{padding:16px;margin:14px 0}.label{font-size:13px;color:#cbd5cc;font-weight:700;display:block;margin-bottom:8px}.input{width:100%;padding:14px;border-radius:14px;background:#09100a;border:1px solid var(--line);color:#fff;outline:none}.preview{width:100%;aspect-ratio:1.25;border-radius:20px;background:#0b120d;border:1px dashed #38503d;display:grid;place-items:center;overflow:hidden;margin:14px 0}.preview img{width:100%;height:100%;object-fit:contain}.upload{display:block;text-align:center;padding:15px;border-radius:16px;border:1px solid #3b5c42;background:#132017;font-weight:800}.upload input{display:none}.finger{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center}.swatch{width:54px;height:54px;border-radius:18px;border:3px solid #ffffff33}.mini{font-size:12px;color:var(--muted)}.colourGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.colour{height:65px;border-radius:18px;border:3px solid transparent;box-shadow:inset 0 0 0 1px #ffffff29}.colour.active{border-color:#fff}.customRow{display:flex;align-items:center;gap:12px}.customRow input[type=color]{width:60px;height:52px;border:0;border-radius:14px;background:none}.cameraWrap{position:relative;border-radius:25px;overflow:hidden;background:#000;aspect-ratio:3/4;border:1px solid #29482e}.cameraWrap video,.cameraWrap canvas{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.camAsk{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(#09100bd9,#071008ed);z-index:5}.camAsk .ico{margin:auto}.scannerTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pill{padding:8px 11px;border-radius:999px;background:#16301a;color:#9aff60;font-size:12px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.metric{padding:12px;border-radius:16px;background:#111b13;border:1px solid var(--line)}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:20px}.bar{height:8px;background:#1e2d21;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);transition:.25s}.guide{padding:15px;border:1px solid #37573d;border-radius:18px;background:#122016;margin-top:11px}.guide small{color:var(--muted);display:block}.guide b{display:block;margin-top:4px}.found{color:var(--green)}.warning{font-size:12px;color:#c8d0c8;background:#111912;border:1px solid var(--line);padding:12px;border-radius:14px;margin-top:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;padding:8px 18px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);background:#09100af2;border-top:1px solid var(--line);backdrop-filter:blur(15px);z-index:30}.nav{border:0;background:none;color:#7f8e81;font-size:12px}.nav.active{color:var(--green)}.nav span{display:block;font-size:21px;margin-bottom:2px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:#eef8ec;color:#0c160c;padding:11px 16px;border-radius:12px;font-weight:800;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){body{padding:20px}.app{border:1px solid var(--line);border-radius:34px;box-shadow:0 30px 100px #0008;overflow:hidden}.bottom{border-radius:0 0 34px 34px}}
</style>
</head>
<body><div class="app"><header class="top"><button id="back" class="back hidden">←</button><div class="brand">Ball<b>Hunter</b></div></header><main id="root"></main></div><nav class="bottom"><button class="nav active" data-go="home"><span>⌂</span>Home</button><button class="nav" data-go="balls"><span>◉</span>My Balls</button><button class="nav" data-go="about"><span>◎</span>How it works</button></nav><div id="toast" class="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), root=$('#root'), back=$('#back');
const state={page:'home',stack:[],balls:JSON.parse(localStorage.getItem('bh-balls')||'[]'),photo:null,target:null,stream:null,timer:null,smooth:Array(48).fill(0),frames:0,visited:new Set()};
const colours=[['Green','#85e62f'],['Yellow','#f1dc25'],['Orange','#ff8b22'],['Pink','#ef55af'],['Red','#e64b4b'],['Blue','#3d8ee8'],['White','#eeeeea'],['Purple','#925de6']];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function save(){localStorage.setItem('bh-balls',JSON.stringify(state.balls))}
function stopCam(){clearInterval(state.timer);state.timer=null;if(state.stream)state.stream.getTracks().forEach(t=>t.stop());state.stream=null}
function go(page,push=true){stopCam();if(push)state.stack.push(state.page);state.page=page;render()}
back.onclick=()=>{const p=state.stack.pop()||'home';go(p,false)};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
function nav(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.go===state.page));back.classList.toggle('hidden',['home','balls','about'].includes(state.page))}
function render(){nav(); if(state.page==='home')home();else if(state.page==='balls')balls();else if(state.page==='add')add();else if(state.page==='pick')pick();else if(state.page==='quick')quick();else if(state.page==='scan')scan();else about()}
function home(){root.innerHTML=`<section class="hero"><div class="eyebrow">BALLHUNTER VISION BETA</div><h1>Find your lost ball <span>faster.</span></h1><p>Save the exact ball before playing, then use your phone camera to scan grass, leaves and clutter for matching visible fragments.</p><div class="orb"><div class="ball"></div></div></section><section class="stack"><button class="action primary" id="saved"><div class="ico">◉</div><div><strong>Find my saved ball</strong><small>Search using its BallPrint</small></div><b>→</b></button><button class="action" id="quick"><div class="ico">◐</div><div><strong>Quick colour search</strong><small>No saved photo needed</small></div><b>→</b></button><button class="action" id="add"><div class="ico">＋</div><div><strong>Add a ball before playing</strong><small>Photograph the exact ball</small></div><b>→</b></button></section><p class="warning">Best results: photograph the ball closely in daylight, then scan the lost area slowly from several angles.</p>`;$('#saved').onclick=()=>state.balls.length?go('pick'):go('add');$('#quick').onclick=()=>go('quick');$('#add').onclick=()=>go('add')}
function balls(){root.innerHTML=`<div class="sectionHead"><div><div class="eyebrow">BALL LIBRARY</div><h2>My balls</h2></div><button class="plus" id="plus">+</button></div><div class="balls" id="list"></div>`;$('#plus').onclick=()=>go('add');const l=$('#list');if(!state.balls.length)l.innerHTML=`<div class="panel"><b>No BallPrints yet.</b><p class="copy">Add the ball before you start playing.</p><button class="btn" id="emptyAdd">Add my first ball</button></div>`,$('#emptyAdd').onclick=()=>go('add');else state.balls.forEach((b,i)=>{const r=document.createElement('div');r.className='card ballRow';r.innerHTML=`<img class="thumb" src="${b.photo}"><div class="grow"><strong>${esc(b.name)}</strong><small>BallPrint · ${b.hex}</small></div><button class="back" title="Delete">×</button>`;r.querySelector('button').onclick=()=>{state.balls.splice(i,1);save();balls()};l.appendChild(r)})}
function add(){state.photo=null;root.innerHTML=`<div class="sectionHead"><div><div class="eyebrow">BALLPRINT</div><h2>Add your ball</h2></div></div><div class="panel"><label class="label">Ball name</label><input id="name" class="input" placeholder="Green tennis ball"><div id="preview" class="preview"><span class="copy">Keep the ball centered and close</span></div><label class="upload">📷 Take / choose ball photo<input id="file" type="file" accept="image/*" capture="environment"></label></div><div id="fp" class="panel hidden"></div><button id="create" class="btn" style="width:100%" disabled>Create BallPrint</button>`;$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const data=await resize(f,420);state.photo=data;$('#preview').innerHTML=`<img src="${data}">`;const fp=await fingerprint(data);state.pending=fp;$('#fp').classList.remove('hidden');$('#fp').innerHTML=`<div class="finger"><div class="swatch" style="background:${fp.hex}"></div><div><b>Reference fingerprint ready</b><div class="mini">Dominant colour ${fp.hex} · saturation ${Math.round(fp.s*100)}%</div></div></div>`;$('#create').disabled=false};$('#create').onclick=()=>{const name=$('#name').value.trim()||'My ball';state.balls.unshift({id:Date.now(),name,photo:state.photo,...state.pending});save();toast('BallPrint saved');go('balls')}}
function pick(){root.innerHTML=`<div class="sectionHead"><div><div class="eyebrow">REFERENCE SEARCH</div><h2>Select your ball</h2></div></div><p class="copy">Choose the exact ball you want BallHunter to look for.</p><div id="pickList" class="balls"></div>`;state.balls.forEach(b=>{const r=document.createElement('button');r.className='action';r.innerHTML=`<img class="thumb" src="${b.photo}"><div><strong>${esc(b.name)}</strong><small>${b.hex}</small></div><b>→</b>`;r.onclick=()=>{state.target={name:b.name,h:b.h,s:b.s,v:b.v,hex:b.hex};go('scan')};$('#pickList').appendChild(r)})}
function quick(){root.innerHTML=`<div class="sectionHead"><div><div class="eyebrow">QUICK SEARCH</div><h2>Ball colour</h2></div></div><p class="copy">Choose the closest colour. You can fine-tune it below.</p><div class="colourGrid" id="cg"></div><div class="panel customRow"><input id="custom" type="color" value="#85e62f"><div><b id="hex">#85E62F</b><div class="mini">Custom target colour</div></div></div><button class="btn" id="start" style="width:100%">Start camera search</button>`;let active='#85e62f';colours.forEach(([n,c])=>{const b=document.createElement('button');b.className='colour'+(c===active?' active':'');b.style.background=c;b.title=n;b.onclick=()=>{active=c;$('#custom').value=c;$('#hex').textContent=c.toUpperCase();document.querySelectorAll('.colour').forEach(x=>x.classList.remove('active'));b.classList.add('active')};$('#cg').appendChild(b)});$('#custom').oninput=e=>{active=e.target.value;$('#hex').textContent=active.toUpperCase();document.querySelectorAll('.colour').forEach(x=>x.classList.remove('active'))};$('#start').onclick=()=>{const [h,s,v]=rgb2hsv(...hex2rgb(active));state.target={name:'Quick colour ball',h,s,v,hex:active};go('scan')}}
function scan(){state.smooth=Array(48).fill(0);state.frames=0;state.visited=new Set();root.innerHTML=`<div class="scannerTop"><div><div class="eyebrow">LIVE SEARCH</div><b id="targetName">${esc(state.target.name)}</b></div><span class="pill" id="status">READY</span></div><div class="cameraWrap"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="ask" class="camAsk"><div><div class="ico">◉</div><h3>Camera access needed</h3><p class="copy">Use the rear camera and move slowly across the lost area.</p><button class="btn" id="enable">Enable camera</button></div></div></div><div class="metrics"><div class="metric"><small>Best match</small><b id="best">0%</b></div><div class="metric"><small>Coverage</small><b id="coverage">0%</b></div><div class="metric"><small>Frames</small><b id="frames">0</b></div></div><div class="bar"><i id="bar"></i></div><div class="guide"><small>Live guidance</small><b id="guide">Move slowly and scan the ground</b></div><div class="warning">BallHunter looks for colour fragments that match your target across repeated frames. A fully covered ball cannot be seen by a normal phone camera.</div>`;$('#enable').onclick=startCam}
async function startCam(){try{state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});const v=$('#video');v.srcObject=state.stream;await v.play();$('#ask').classList.add('hidden');$('#status').textContent='SCANNING';state.timer=setInterval(analyse,220)}catch(e){toast('Camera permission failed');$('#guide').textContent='Allow camera permission in your browser settings'}}
function analyse(){const v=$('#video'),o=$('#overlay');if(!v.videoWidth)return;o.width=v.clientWidth*devicePixelRatio;o.height=v.clientHeight*devicePixelRatio;const W=320,H=240,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,W,H);const d=x.getImageData(0,0,W,H).data, cols=8,rows=6,cw=W/cols,ch=H/rows;let best=0,bi=0;for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){let hit=0,total=0,peak=0;for(let yy=gy*ch;yy<(gy+1)*ch;yy+=4)for(let xx=gx*cw;xx<(gx+1)*cw;xx+=4){const i=(Math.floor(yy)*W+Math.floor(xx))*4,[h,s,val]=rgb2hsv(d[i],d[i+1],d[i+2]);const hd=Math.min(Math.abs(h-state.target.h),360-Math.abs(h-state.target.h));let q=1-hd/55;q=Math.max(0,q);q*=Math.max(0,1-Math.abs(s-state.target.s)/.65);q*=Math.max(.25,1-Math.abs(val-state.target.v)/.75);if(q>.45)hit+=q;if(q>peak)peak=q;total++}const raw=Math.min(1,(hit/total)*4.8+peak*.25);const idx=gy*cols+gx;state.smooth[idx]=state.smooth[idx]*.72+raw*.28;if(state.smooth[idx]>best){best=state.smooth[idx];bi=idx}}state.frames++;if(best>.18)state.visited.add(bi);drawOverlay(o,best,bi,cols,rows);const pct=Math.round(best*100);$('#best').textContent=pct+'%';$('#frames').textContent=state.frames;const cover=Math.min(100,Math.round((state.visited.size/48)*100));$('#coverage').textContent=cover+'%';$('#bar').style.width=cover+'%';const gx=bi%cols,gy=Math.floor(bi/cols);let dir=gx<2?'Move left':gx>5?'Move right':gy<2?'Aim higher':gy>3?'Aim lower':'Hold here and move closer';if(pct>72)dir='Strong match — check this highlighted area';else if(pct>45)dir='Possible ball — scan this area from another angle';$('#guide').textContent=dir;$('#guide').classList.toggle('found',pct>72);$('#status').textContent=pct>72?'HIGH MATCH':pct>42?'POSSIBLE':'SCANNING'}
function drawOverlay(o,best,bi,cols,rows){const g=o.getContext('2d');g.clearRect(0,0,o.width,o.height);const cw=o.width/cols,ch=o.height/rows,gx=bi%cols,gy=Math.floor(bi/cols);g.strokeStyle=best>.7?'#83f23c':best>.4?'#ffd45b':'#ffffff55';g.lineWidth=4*devicePixelRatio;g.strokeRect(gx*cw+5,gy*ch+5,cw-10,ch-10);if(best>.32){g.fillStyle=best>.7?'#83f23c':'#ffd45b';g.font=`700 ${13*devicePixelRatio}px system-ui`;g.fillText(`Possible ball ${Math.round(best*100)}%`,gx*cw+8,Math.max(22,gy*ch-7))}}
function about(){root.innerHTML=`<div class="sectionHead"><div><div class="eyebrow">HOW IT WORKS</div><h2>BallHunter logic</h2></div></div><div class="stack"><div class="panel"><b>1 · Save the exact ball</b><p class="copy">A centered reference photo creates a BallPrint using dominant hue, saturation and brightness.</p></div><div class="panel"><b>2 · Scan multiple frames</b><p class="copy">The camera is divided into search regions. Each region is repeatedly scored for pixels similar to the BallPrint.</p></div><div class="panel"><b>3 · Keep partial evidence</b><p class="copy">Scores are smoothed across frames, so a brief visible fragment can remain a candidate while you change angle.</p></div><div class="panel"><b>4 · Follow the highlight</b><p class="copy">The strongest region is outlined and the app tells you where to move or inspect more closely.</p></div></div>`}
async function resize(file,max){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function fingerprint(src){return new Promise(res=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.drawImage(im,0,0,180,180);const d=x.getImageData(0,0,180,180).data;let hs=Array(36).fill(0),ss=0,vs=0,n=0;for(let y=20;y<160;y+=2)for(let xx=20;xx<160;xx+=2){if(Math.hypot(xx-90,y-90)>67)continue;const i=(y*180+xx)*4,[h,s,v]=rgb2hsv(d[i],d[i+1],d[i+2]);if(s>.18&&v>.12)hs[Math.floor(h/10)%36]+=s*v;ss+=s;vs+=v;n++}let bin=hs.indexOf(Math.max(...hs)),h=bin*10+5,s=ss/n,v=vs/n;const rgb=hsv2rgb(h,s,v),hex=rgb2hex(rgb);res({h,s,v,hex})};im.src=src})}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;let M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m,h=0;if(d){if(M===r)h=60*((g-b)/d%6);else if(M===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return[h,M?d/M:0,M]}
function hsv2rgb(h,s,v){let c=v*s,x=c*(1-Math.abs(h/60%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return[r,g,b].map(q=>Math.round((q+m)*255))}
function hex2rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}function rgb2hex(a){return'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
})();
</script></body></html>
